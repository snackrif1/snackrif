<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snack Rif</title>

<style>

body{
    margin:0;
    background:#e8dfcf;
    font-family:Arial,sans-serif;
    color:#fff;
}

.cover img{
    width:100%;
    display:block;
}

.hero{
    background:linear-gradient(to bottom,#1a0000,#2a0c03);
    text-align:center;
    padding:40px 20px;
}

.hero h1{
    font-size:75px;
    margin:0;
    font-weight:bold;
}

.hero h2{
    color:#f0c67b;
    margin-top:15px;

    letter-spacing:2px;
}

.hero p{
    font-size:20px;
    margin-top:20px;
}

.menu-btn{
    display:inline-block;
    margin-top:35px;
    background:#ff2a2a;
    color:white;
    text-decoration:none;
    padding:24px 80px;
    border-radius:60px;
    font-size:32px;
    font-weight:bold;
    box-shadow:0 0 30px rgba(255,0,0,.6);
}

.contact-box{
    background:#efe5d6;
    margin:35px;
    border-radius:40px;
    padding:40px 25px;
}

.contact-title{
    text-align:center;
    color:#2d140d;
    font-size:55px;
    margin-bottom:35px;
}

.contact-buttons{
    display:flex;
    flex-direction:column;
    gap:25px;
}

.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:28px;
    border-radius:35px;
    font-size:22px;
    font-weight:bold;
    color:white;
    text-decoration:none;
}

.btn img{
    width:38px;
    height:38px;
}

.whatsapp{
    background:#66d46d;
}

.instagram{
    background:#cc3d7d;
}

.tiktok{
    background:#000;
}

.location{
    background:#b64835;
}

.address{
    text-align:center;
    color:#2d140d;
    margin-top:40px;
    font-size:22px;
    line-height:1.8;
}

.phone{
    text-align:center;
    margin-top:30px;
    color:#2d140d;
    font-size:30px;
    font-weight:bold;
}

footer{
    background:#2a0c03;
    color:white;
    text-align:center;
    padding:25px;
    font-size:22px;
}

        <a href="https://instagram.com/snackrif" class="btn instagram">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">

        </a>

        <a href="https://tiktok.com" class="btn tiktok">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">

        </a>

        <a href="https://maps.google.com" class="btn location">
            <img src="https://cdn-icons-png.flaticon.com/512/684/684908.png">

© Snack Rif Cafeteria
